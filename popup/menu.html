<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormFlow</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional styles for CSV import */
        .csv-import {
            margin: 15px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .csv-import h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .file-input-container {
            display: flex;
            margin-bottom: 10px;
        }
        .file-input-container input[type="file"] {
            flex: 1;
        }
        .support-panel { margin: 12px 0; padding: 10px; background: #fffbe6; border: 1px solid #f0e2a0; border-radius: 6px; text-align: center; }
        .support-panel[hidden] { display: none; }
        .support-title { font-size: 12px; color: #5f6368; margin-bottom: 8px; }
        .support-link { background: #ffd700; color: #000; border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
        .support-or { font-size: 11px; color: #5f6368; margin: 10px 0 6px; }
        .support-qr { width: 150px; height: 150px; image-rendering: pixelated; }
        .support-upi { font-size: 12px; margin-top: 6px; word-break: break-all; }
        #supportPanel .support-copy { background: #e8f0fe; color: #1a56c4; border: 1px solid #c6d7f7; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; margin-left: 6px; }
        #supportPanel .support-copy:hover { background: #d2e3fc; }
        #supportPanel .support-link { color: #000; }
        .hint-text { font-size: 11px; color: #5f6368; margin-top: 6px; }
        #exportCsvBtn { margin-top: 8px; }
        .csv-options {
            margin: 10px 0;
        }
        .status-message {
            margin-top: 10px;
            padding: 5px;
            border-radius: 3px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../images/icon-96.png" alt="Logo" class="logo">
            <h1>FormFlow</h1>
        </div>

        <!-- CSV Import Section -->
        <div class="csv-import">
            <h3>Import from CSV</h3>
            <div class="file-input-container">
                <input type="file" id="csvFile" accept=".csv" />
                <button id="uploadCsvBtn">Upload CSV</button>
            </div>
            <div class="csv-options">
                <label>
                    <input type="checkbox" id="overwriteExisting" checked />
                    Overwrite existing fields
                </label>
            </div>
            <div id="importStatus" class="status-message"></div>
            <button id="exportCsvBtn" type="button">Export answers (CSV backup)</button>
            <div class="hint-text">Back up before removing or moving the extension. Removing it deletes saved answers.</div>
        </div>

        <!-- Settings Section -->
        <div class="settings">
            <label for="dateFormat">Date format</label>
            <select id="dateFormat">
                <option value="AUTO">Auto</option>
                <option value="DMY">DD/MM/YYYY</option>
                <option value="MDY">MM/DD/YYYY</option>
            </select>
        </div>
        <div class="settings">
            <label for="highlightToggle">Outline questions</label>
            <input type="checkbox" id="highlightToggle" checked>
            <span class="hint">green = filled, red = needs you</span>
        </div>
        <div class="settings">
            <label for="learnToggle">Offer to save new answers</label>
            <input type="checkbox" id="learnToggle" checked>
        </div>

        <div id="formData">
            <!-- Form rows will be added here dynamically -->
        </div>        
        <button id="addRowBtn">+ Add New</button>
        <br>

        <div id="supportPanel" class="support-panel" hidden>
            <div class="support-title">Enjoying FormFlow? Totally optional:</div>
            <button type="button" id="bmcBtn" class="support-link">Buy me a coffee</button>
            <div class="support-or">or pay with any UPI app</div>
            <img src="../images/upi-qr.png" alt="UPI QR code" class="support-qr">
            <div class="support-upi"><span id="upiId">shubhbohra44-4@okicici</span> <button type="button" id="copyUpiBtn" class="support-copy">Copy</button></div>
        </div>

        <div class="footer">
            <button class="footer-btn" id="donate-btn">☕ Support</button>
            <button class="footer-btn" id="share-btn">🔗 Github</button>
            <button class="footer-btn" id="info-btn">ℹ️ Info</button>
        </div>
    </div>

    <script src="../scripts/storage.js"></script>
    <script src="../scripts/csvParser.js"></script>
    <script src="menu.js"></script>
</body>
</html>
